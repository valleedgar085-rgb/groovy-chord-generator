name: groovy_chord_generator
description: Create amazing chord progressions for any genre - A mobile-optimized music creation tool
publish_to: 'none'
version: 2.8.0+5

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  cupertino_icons: ^1.0.6
  flutter_soloud: ^4.1.7

  # Firebase packages - kept on one compatible modern generation so Android
  # plugins share current compileSdk requirements.
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0
  firebase_storage: ^13.5.0
  firebase_analytics: ^12.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

# Launcher icon configuration
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#090A12"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
